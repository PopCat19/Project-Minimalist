// Hey there! This is where you configure the skin, refer to the wiki to learn more about each variable: https://github.com/PopCat19/Project-Minimalist/wiki

[General]
// Skin Info
Name: [Combo]-PM-RabbitOk2405
Author: PopCat19
Version: 2.5

// Cursor Config
CursorExpand: 0
CursorCentre: 1
CursorRotate: 0
CursorTrailRotate: 0

// Sound Config
LayeredHitSounds: 1
ComboBurstRandom: 0
//CustomComboBurstSounds:

// Hitcircle Overlay Config
HitCircleOverlayAboveNumber: 0

// Sliderball Config
SliderBallFlip: 1
AllowSliderBallTint: 1 // Normal
//AllowSliderBallTint: 0 // Instafade, avoids coloring slider follow circle.

// Spinner Config
SpinnerNoBlink: 0
SpinnerFadePlayfield: 0
SpinnerFrequencyModulate: 1


[Colours]
// Text Color Config
SongSelectActiveText:  194,224,255  // Primary
SongSelectInactiveText: 153,204,255 // Secondary
InputOverlayText: 153,204,255 // Secondary

// SongSelect Star Color Config
StarBreakAdditive: 153,204,255 // Secondary

// Slider Color Config
SliderBall: 255,255,255 // White
SliderBorder: 153,204,255 // Secondary
SliderTrackOverride: 0,0,0 // Black

// Combo Color Config HD 1
Combo1: 71,163,255 // Volta 64
Combo2: 117,71,255 // Volta 64
//Combo3: 71,255,209 // Gashyanta 64
//Combo4: 71,255,71 // Green 64

[Fonts]
// HitCircle Font Config
HitCirclePrefix: default
HitCircleOverlap: 0 // Normal
//HitCircleOverlap: 154 // Instafade, divide default font width (instafade hitcircle images) by 2 to get overlap value.

// Score Font Config
ScorePrefix: score
ScoreOverlap: 0

// Combo Font Config
ComboPrefix: combo
ComboOverlap: 0
